{% block content %}
  {% if user.is_authenticated %}
    <p>Welcome, {{ user.username }}!</p>
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Log Out</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}"><button type="button">Log In</button></a>
    <a href="{% url 'register' %}"><button type="button">Sign Up</button></a>
  {% endif %}

<form action = "{% url 'tasklist' %}" method="get">
    <button type="submit">Tasks</button>
</form>
{% endblock %}
