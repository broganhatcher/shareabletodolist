<h2>Manage Group: {{ group.name }}</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Add Member</button>
</form>

<h3>Members</h3>
<ul>
  {% for member in group.members.all %}
    <li>
      {{ member.username }}
      {% if member == group.owner %}
        <strong>(Owner)</strong>
      {% else %}
        <form method="post" action="{% url 'remove_group_member' group.pk member.id %}" style="display:inline">
          {% csrf_token %}
          <button type="submit">Remove</button>
        </form>
      {% endif %}
    </li>
  {% endfor %}
</ul>

<form action="{% url 'group_list' %}" method="get" style="display:inline">
  <button type="submit">Back to Groups</button>
</form>
