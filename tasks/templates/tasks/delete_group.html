<h2>Delete Group</h2>
<p>Are you sure you want to delete "{{ object.name }}"? This will also delete all tasks assigned to this group.</p>

<form method="post" style="display:inline">
  {% csrf_token %}
  <button type="submit">Confirm Delete</button>
</form>

<form action="{% url 'group_list' %}" method="get" style="display:inline">
  <button type="submit">Cancel</button>
</form>
