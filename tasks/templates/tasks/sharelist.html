<h2>Share {{ project.name }}</h2>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Add Member</button></form>
<h3>Current Members</h3>
{% for member in project.members.all %}<form method="post" action="{% url 'removelistmember' project.pk member.pk %}">{% csrf_token %}{{ member.username }} <button type="submit">Remove</button></form>{% empty %}<p>No additional members yet.</p>{% endfor %}
<a href="{% url 'listdetail' project.pk %}">Back</a>
